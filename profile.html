<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="stack">
    <h1>My profile</h1>

    <section class="card wallet-card">
      <p class="wallet-label">Wallet balance</p>
      <p class="wallet-balance">₦<span id="balance">0</span></p>
      <a class="btn btn-primary" href="deposit.html">Deposit</a>
    </section>

    <section class="card">
      <h2>Account</h2>
      <dl class="details">
        <dt>Email</dt><dd id="email"></dd>
        <dt>Username</dt><dd id="username"></dd>
        <dt>WhatsApp</dt><dd id="whatsapp"></dd>
      </dl>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <h2>Wallet history</h2>
      <div id="wallet-history"></div>
    </section>

    <section class="card">
      <h2>Change username</h2>
      <form id="username-form" class="form">
        <label>New username <input id="new-username" type="text" minlength="3" maxlength="20" required></label>
        <button type="submit" class="btn btn-primary">Change username</button>
      </form>
      <p id="username-message" class="message"></p>
    </section>

    <section class="card">
      <h2>Change PIN</h2>
      <form id="pin-form" class="form">
        <label>Current PIN <input id="current-pin" type="password" inputmode="numeric" maxlength="6" required></label>
        <label>New PIN <input id="new-pin" type="password" inputmode="numeric" maxlength="6" required></label>
        <label>Re-enter new PIN <input id="new-pin2" type="password" inputmode="numeric" maxlength="6" required></label>
        <button type="submit" class="btn btn-primary">Change PIN</button>
      </form>
      <p id="pin-message" class="message"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const typeLabels = {
  deposit: "Deposit",
  entry_fee: "Tournament entry",
  winnings: "Winnings",
  withdrawal: "Withdrawal",
  refund: "Refund",
  adjustment: "Adjustment"
};

async function loadWalletHistory(userId) {
  const list = document.getElementById("wallet-history");
  const { data, error } = await db
    .from("wallet_transactions")
    .select("amount, type, note, created_at")
    .eq("user_id", userId)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    list.textContent = "Could not load your wallet history.";
    return;
  }

  list.textContent = "";
  if (data.length === 0) {
    list.textContent = "No transactions yet.";
    return;
  }

    data.forEach((row) => {
    const when = new Date(row.created_at).toLocaleString("en-NG", { timeZone: "Africa/Lagos" });

    const line = document.createElement("div");
    line.className = "history-row";

    const main = document.createElement("div");
    main.className = "history-main";

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = typeLabels[row.type] || row.type;

    const meta = document.createElement("span");
    meta.className = "history-meta";
    meta.textContent = when + (row.note ? " - " + row.note : "");

    main.appendChild(title);
    main.appendChild(meta);

    const amount = document.createElement("span");
    amount.className = "amount " + (row.amount > 0 ? "amount-in" : "amount-out");
    amount.textContent =
      (row.amount > 0 ? "+" : "-") + "₦" + Math.abs(row.amount).toLocaleString("en-NG");

    line.appendChild(main);
    line.appendChild(amount);
    list.appendChild(line);
  });
}

    async function loadProfile() {
      const { data: sessionData } = await db.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "login.html";
        return;
      }

      const user = sessionData.session.user;
      document.getElementById("email").textContent = user.email;

      const { data: profile, error } = await db
        .from("profiles")
        .select("username, whatsapp")
        .eq("id", user.id)
        .single();

      if (error) {
        document.getElementById("message").textContent = "Could not load your profile.";
        return;
      }

      document.getElementById("username").textContent = profile.username;
      document.getElementById("whatsapp").textContent = profile.whatsapp;
      const { data: wallet } = await db
  .from("wallet_balances")
  .select("balance")
  .eq("user_id", user.id)
  .maybeSingle();

const balance = wallet ? wallet.balance : 0;
document.getElementById("balance").textContent = balance.toLocaleString("en-NG");
await loadWalletHistory(user.id);
    }

   
   

document.getElementById("username-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const newName = document.getElementById("new-username").value.trim();
  const box = document.getElementById("username-message");

  const { error } = await db.rpc("change_username", { new_username:  newName});

  if (error) {
    if (error.message.includes("profiles_username_unique")) {
      box.textContent = "That username is taken.";
    } else if (error.message.includes("username_format")) {
      box.textContent = "Use 3-20 letters, numbers or underscores.";
    } else {
      box.textContent = error.message;
    }
    return;
  }

  box.textContent = "Username changed!";
  loadProfile();
});

document.getElementById("pin-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const currentPin = document.getElementById("current-pin").value;
  const newPin = document.getElementById("new-pin").value;
  const newPin2 = document.getElementById("new-pin2").value;
  const box = document.getElementById("pin-message");

  if (!/^[0-9]{6}$/.test(newPin)) {
    box.textContent = "PIN must be exactly 6 digits.";
    return;
  }
  if (newPin !== newPin2) {
    box.textContent = "The new PINs do not match.";
    return;
  }

  const { error } = await db.rpc("change_pin", { current_pin: currentPin, new_pin: newPin });

  if (error) {
    box.textContent = error.message;
    return;
  }

  event.target.reset();
  box.textContent = "PIN changed!";
});

    loadProfile();
  </script>
  <script src="nav.js"></script>
</body>
</html>
