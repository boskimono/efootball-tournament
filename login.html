<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="auth card">
    <h1>Log in</h1>

    <form id="login-form" class="form">
      <label>Email <input id="email" type="email" required></label>
      <label>6-digit PIN <input id="pin" type="password" inputmode="numeric" maxlength="6" required></label>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <p id="message" class="message"></p>
    <p class="muted">No account yet? <a href="register.html">Register</a></p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    async function showState() {
      const { data } = await db.auth.getSession();
      if (data.session) {
        message.textContent =
          "You are already logged in as " + data.session.user.email +
          ". Use Log out in the menu to switch accounts.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pin = document.getElementById("pin").value;

      const { error } = await db.auth.signInWithPassword({
        email: email,
        password: pin
      });

      if (error) {
        const text = (error.message || "").toLowerCase();
        if (error.status === 429 || text.includes("rate limit")) {
          message.textContent = "Too many attempts. Please wait a few minutes and try again.";
        } else {
          message.textContent = "Wrong email or PIN.";
        }
        return;
      }
      window.location.href = "profile.html";
    });



    showState();
  </script>
  <script src="nav.js"></script>
</body>
</html>
