<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="auth card">
    <h1>Join Broskis Gaming Hub</h1>

    <form id="register-form" class="form">
      <label>Email <input id="email" type="email" required></label>
      <label>Username <input id="username" type="text" minlength="3" maxlength="20" required></label>
      <label>WhatsApp number <input id="whatsapp" type="tel" required></label>
      <label>6-digit PIN <input id="pin" type="password" inputmode="numeric" maxlength="6" required></label>
      <label>Re-enter PIN <input id="pin2" type="password" inputmode="numeric" maxlength="6" required></label>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <p id="message" class="message"></p>
    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("register-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.replace(/\s/g, "");
      const pin = document.getElementById("pin").value;
      const pin2 = document.getElementById("pin2").value;

      if (!/^[0-9]{6}$/.test(pin)) {
        message.textContent = "PIN must be exactly 6 digits.";
        return;
      }
      if (pin !== pin2) {
        message.textContent = "The two PINs do not match.";
        return;
      }
      if (!/^\+?[0-9]{10,15}$/.test(whatsapp)) {
        message.textContent = "Enter a valid WhatsApp number.";
        return;
      }

      const { data, error } = await db.auth.signUp({
        email: email,
        password: pin,
        options: { data: { username: username, whatsapp: whatsapp } }
      });

      if (error) {
        if (error.message.includes("already registered")) {
          message.textContent = "Email already in use. Log in instead.";
        } else if (error.message.includes("Database error")) {
          message.textContent = "That username is taken or has invalid characters.";
        } else {
          message.textContent = error.message;
        }
        return;
      }

      message.textContent = "Account created!";
            setTimeout(() => { window.location.href = "profile.html"; }, 1500);
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
