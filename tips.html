<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tips - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="stack">
    <h1>Tips</h1>
    <div id="tips" class="stack"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
      const box = document.getElementById("tips");
      const { data, error } = await db
        .from("content_items")
        .select("title, body")
        .eq("kind", "tip")
        .is("tournament_id", null)
        .order("sort_order", { ascending: true });

      if (error) {
        box.textContent = "Could not load tips.";
        return;
      }

      box.textContent = "";
      if (data.length === 0) {
        box.textContent = "No tips yet.";
        return;
      }

            data.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card tip";

        const h = document.createElement("h3");
        h.textContent = item.title;

        const p = document.createElement("p");
        p.className = "prose";
        p.textContent = item.body;

        card.appendChild(h);
        card.appendChild(p);
        box.appendChild(card);
      });
    }

    init();
  </script>
    <script src="nav.js"></script>
</body>
</html>
