<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
     <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="stack">
    <h1>Deposit</h1>

    <section class="card">
      <h2 class="step-title"><span class="step-num">1</span> Choose amount</h2>
      <div class="form">
        <label>Amount (₦1,000 to ₦10,000)
          <input id="amount" type="number" min="1000" max="10000" step="1" inputmode="numeric">
        </label>
      </div>
    </section>

    <section class="card">
      <h2 class="step-title"><span class="step-num">2</span> Transfer to this account</h2>
      <dl class="details">
        <dt>Bank</dt><dd id="bank-name"></dd>
        <dt>Account name</dt><dd id="account-name"></dd>
      </dl>
      <div class="copy-row">
        <span id="account-number" class="account-number"></span>
        <button type="button" id="copy-number" class="btn btn-secondary btn-small">Copy</button>
      </div>
    </section>

    <section class="card">
      <h2 class="step-title"><span class="step-num">3</span> Attach your receipt</h2>
      <div class="form">
        <label>Receipt (JPG, PNG or PDF, up to 5 MB)
          <input id="receipt" type="file" accept="image/jpeg,image/png,application/pdf">
        </label>
      </div>
    </section>

    <button type="button" id="done-button" class="btn btn-primary">Done</button>
    <p id="message" class="message"></p>

    <section class="card">
      <h2>My deposits</h2>
      <div id="deposit-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");
    const doneButton = document.getElementById("done-button");
    let currentUser = null;

async function loadDeposits() {
  const list = document.getElementById("deposit-list");
  const { data, error } = await db
    .from("deposit_requests")
    .select("amount, status, rejection_reason, created_at")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Could not load your deposits.";
    return;
  }

  list.textContent = "";
  if (data.length === 0) {
    list.textContent = "No deposits yet.";
    return;
  }

    data.forEach((row) => {
    const date = new Date(row.created_at).toLocaleString("en-NG", { timeZone: "Africa/Lagos" });

    const line = document.createElement("div");
    line.className = "history-row";

    const main = document.createElement("div");
    main.className = "history-main";

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = "₦" + row.amount.toLocaleString("en-NG");

    const meta = document.createElement("span");
    meta.className = "history-meta";
    let metaText = date;
    if (row.status === "rejected" && row.rejection_reason) {
      metaText += " - Reason: " + row.rejection_reason;
    }
    meta.textContent = metaText;

    main.appendChild(title);
    main.appendChild(meta);

    const badge = document.createElement("span");
    badge.className = "badge badge-" + row.status;
    badge.textContent = row.status.charAt(0).toUpperCase() + row.status.slice(1);

    line.appendChild(main);
    line.appendChild(badge);
    list.appendChild(line);
  });
}

    async function init() {
      const { data: sessionData } = await db.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "login.html";
        return;
      }
      currentUser = sessionData.session.user;

      const { data: settings, error } = await db.from("app_settings").select("key, value");
      if (error) {
        message.textContent = "Could not load bank details.";
        return;
      }

      const map = {};
      settings.forEach((row) => { map[row.key] = row.value; });
      document.getElementById("bank-name").textContent = map.bank_name;
      document.getElementById("account-name").textContent = map.account_name;
      document.getElementById("account-number").textContent = map.account_number;
      await loadDeposits();
    }

    document.getElementById("copy-number").addEventListener("click", async () => {
      const number = document.getElementById("account-number").textContent;
      await navigator.clipboard.writeText(number);
      message.textContent = "Account number copied.";
    });

    doneButton.addEventListener("click", async () => {
      const amount = Number(document.getElementById("amount").value);
      const file = document.getElementById("receipt").files[0];

      if (!Number.isInteger(amount) || amount < 1000 || amount > 10000) {
        message.textContent = "Enter an amount between ₦1,000 and ₦10,000.";
        return;
      }
      if (!file) {
        message.textContent = "Attach your receipt first.";
        return;
      }

      const extensions = { "image/jpeg": "jpg", "image/png": "png", "application/pdf": "pdf" };
      const ext = extensions[file.type];
      if (!ext) {
        message.textContent = "Receipt must be a JPG, PNG or PDF.";
        return;
      }
      if (file.size > 5242880) {
        message.textContent = "Receipt must be 5 MB or smaller.";
        return;
      }

      doneButton.disabled = true;
      message.textContent = "Uploading...";

      const path = currentUser.id + "/" + Date.now() + "." + ext;
      const { error: uploadError } = await db.storage.from("receipts").upload(path, file);
      if (uploadError) {
        message.textContent = "Upload failed: " + uploadError.message;
        doneButton.disabled = false;
        return;
      }

      const { error: submitError } = await db.rpc("submit_deposit", { deposit_amount: amount, receipt: path });
      if (submitError) {
        message.textContent = submitError.message;
        doneButton.disabled = false;
        return;
      }

      message.textContent = "Submitted! The moderator will credit your wallet within 48 hours of the money arriving.";      await loadDeposits();
      document.getElementById("amount").value = "";
      document.getElementById("receipt").value = "";
      doneButton.disabled = false;
    });

    init();
  </script>
  <script src="nav.js"></script>
</body>
</html>
