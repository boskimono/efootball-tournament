<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rules and FAQs - Broskis Gaming Hub</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="nav"><a href="index.html">Home</a></nav>

  <main class="stack">
    <h1>Rules and FAQs</h1>
    <p id="message" class="message"></p>

    <section>
      <h2>Tournament rules</h2>
      <div id="rules"></div>
    </section>

    <section>
      <h2>FAQs</h2>
      <div id="faq"></div>
    </section>

    <section class="card">
      <h2>Contact the moderator</h2>
      <div id="contact"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hthcwwthilhdhakqmozz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FX-gMajPsnRqDJAr1Ny0hg_rJ_vRir6";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");
    const slug = new URLSearchParams(window.location.search).get("t") || "broskis-epl";

        function addRule(container, number, title, body) {
      const wrap = document.createElement("article");
      wrap.className = "rule";

      const num = document.createElement("span");
      num.className = "rule-num";
      num.textContent = number;

      const content = document.createElement("div");
      content.className = "rule-body";

      const h = document.createElement("h3");
      h.textContent = title;

      const p = document.createElement("p");
      p.className = "prose";
      p.textContent = body;

      content.appendChild(h);
      content.appendChild(p);
      wrap.appendChild(num);
      wrap.appendChild(content);
      container.appendChild(wrap);
    }

    function addFaq(container, title, body) {
      const wrap = document.createElement("details");
      wrap.className = "faq";

      const summary = document.createElement("summary");
      summary.textContent = title;

      const p = document.createElement("p");
      p.className = "prose";
      p.textContent = body;

      wrap.appendChild(summary);
      wrap.appendChild(p);
      container.appendChild(wrap);
    }

    async function loadSection(kind, tournamentId, container, numbered) {
      let query = db
        .from("content_items")
        .select("title, body")
        .eq("kind", kind)
        .order("sort_order", { ascending: true });

      if (tournamentId === null) {
        query = query.is("tournament_id", null);
      } else {
        query = query.eq("tournament_id", tournamentId);
      }

      const { data, error } = await query;
      if (error) {
        container.textContent = "Could not load this section.";
        return;
      }

      container.textContent = "";
      if (data.length === 0) {
        container.textContent = "Nothing here yet.";
        return;
      }

            data.forEach((item, index) => {
        if (numbered) {
          addRule(container, index + 1, item.title, item.body);
        } else {
          addFaq(container, item.title, item.body);
        }
      });
    }

    async function loadContact(me) {
      const box = document.getElementById("contact");
      if (!me) {
        box.textContent = "Log in to see the moderator's contact details.";
        return;
      }

      const { data, error } = await db
        .from("app_settings")
        .select("key, value")
        .in("key", ["admin_whatsapp", "admin_email"]);

      if (error) {
        box.textContent = "Could not load contact details.";
        return;
      }

      const map = {};
      data.forEach((row) => { map[row.key] = row.value; });
      box.textContent = "";
      const whatsapp = document.createElement("p");
      whatsapp.textContent = "WhatsApp: " + map.admin_whatsapp;
      const email = document.createElement("p");
      email.textContent = "Email: " + map.admin_email;
      box.appendChild(whatsapp);
      box.appendChild(email);
    }

    async function init() {
      const { data: sessionData } = await db.auth.getSession();
      const me = sessionData.session ? sessionData.session.user : null;

      const { data: tournament, error } = await db
        .from("tournaments")
        .select("id")
        .eq("slug", slug)
        .maybeSingle();

      if (error || !tournament) {
        message.textContent = "Tournament not found.";
        return;
      }

      await loadSection("rule", tournament.id, document.getElementById("rules"), true);
      await loadSection("faq", null, document.getElementById("faq"), false);
      await loadContact(me);
    }

    init();
  </script>
   <script src="nav.js"></script>
</body>
</html>
